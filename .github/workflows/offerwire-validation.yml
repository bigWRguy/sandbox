name: Validate OfferWire recovery
on:
  push:
    branches: [offerwire-validation]
permissions:
  contents: read
jobs:
  school-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify whether a school search recovers the held-out offer
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          node --input-type=module - <<'EOF'
          import { setTimeout as pause } from 'node:timers/promises';
          import { normalizeApifyPosts } from './src/collect/apify-posts.js';
          const token=process.env.APIFY_TOKEN;
          const api=async (route,body)=>{
            const r=await fetch('https://api.apify.com/v2'+route,{headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},method:body?'POST':'GET',body:body?JSON.stringify(body):undefined,redirect:'error',signal:AbortSignal.timeout(65000)});
            if(!r.ok)throw new Error('Apify HTTP '+r.status);
            return r.json();
          };
          const {data:account}=await api('/users/me');
          const {data:usage}=await api('/users/me/limits');
          if(!(account?.plan?.tier==='FREE'||/^free$/i.test(account?.plan?.id||''))||account?.plan?.monthlyBasePriceUsd!==0||account.isPaying) throw new Error('Apify Free plan required');
          if(!Number.isFinite(usage?.current?.monthlyUsageUsd)||usage.current.monthlyUsageUsd+.006>4.65)throw new Error('Monthly budget reached');
          const from=Date.parse('2026-11-17T23:00:00Z')/1000, to=from+3600;
          const query='(@UAB_FB OR "UAB" OR "Alabama-Birmingham" OR @HawaiiFootball OR @ToledoFB OR @OhioFootball OR @ZipsFB OR @FIUFootball OR @MeanGreenFB) (offer OR offered OR offers) -filter:retweets -"transfer portal" since_time:'+from+' until_time:'+to;
          let {data:run}=await api('/actors/Z5bVbtCKG1DTk1oVb/runs?maxTotalChargeUsd=0.006&timeout=90&waitForFinish=55',{mode:'searchTweets',searchQueries:[query],searchCategory:'Latest',maxItems:45,maxPages:5});
          for(let poll=0;poll<10&&['READY','RUNNING'].includes(run.status);poll++){
            await pause(4000);
            ({data:run}=await api('/actor-runs/'+encodeURIComponent(run.id)));
          }
          if(run.status!=='SUCCEEDED')throw new Error('Actor ended with status '+run.status);
          const posts=normalizeApifyPosts(await api('/datasets/'+encodeURIComponent(run.defaultDatasetId)+'/items?format=json'));
          console.log('SCHOOL_SEARCH_RESULT',JSON.stringify({recovered:posts.some(post=>post.id==='2122827935610704159'),rows:posts.length,cost:run.usageTotalUsd,eventCharges:run.chargedEventCounts?.['apify-default-dataset-item'],monthlyBefore:usage.current.monthlyUsageUsd}));
          EOF
