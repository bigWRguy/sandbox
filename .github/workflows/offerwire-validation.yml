name: Validate OfferWire recovery
on:
  push:
    branches: [offerwire-validation]
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sample three held-out historical search hours
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          node --input-type=module - <<'EOF'
          import fs from 'node:fs';
          import { fetchApifyRecruiting } from './src/collect/apify-recruiting.js';
          import { fetchPublicRecruiting } from './src/collect/public-recruiting.js';
          import { nameKey } from './src/resolve/players.js';
          const read = (name) => JSON.parse(fs.readFileSync('data/' + name + '.json', 'utf8'));
          const players = new Map(read('players').map((p) => [p.id,p]));
          const legacy = [...read('offers'), ...read('commits')];
          const hrs = ['2026-11-18T00:00:00Z','2026-11-19T02:00:00Z','2026-11-17T12:00:00Z'];
          const key = (type, school, name, year) => [type, school, nameKey(name), year].join('|');
          for (const day of hrs) {
            const from = new Date(day), to = new Date(+from + 3600e3);
            const references = legacy.filter(e => {
              const date = Date.parse(e.offeredAt || e.at);
              return date >= +from && date < +to && e.evidence.some(v => /^\d+$/.test(v.postId));
            });
            const { records } = await fetchPublicRecruiting(to);
            const trackerKeys = new Set(records.map(({ record }) => key(record.kind,record.school_id,record.player_name,record.class_year)));
            let result;
            try { result = await fetchApifyRecruiting({ token: process.env.APIFY_TOKEN, from, to, allowance: 14_400 }); }
            catch (error) { console.log('APIFY_SAMPLE_ERROR', from.toISOString(), error.message); continue; }
            const ids = new Set(result.posts.map(p => p.id)); console.log("NARROW_PHRASE_HITS",day,JSON.stringify(["2122852853312295416","2122843492515004729","2123247096291873180","2123238733344354596","2122661040991481968"].map(id=>ids.has(id))));
            const metrics = (rows) => ({ total: rows.length,
              x: rows.filter(row=>row.evidence.some(e=>ids.has(e.postId))).length,
              combined: rows.filter(row=>row.evidence.some(e=>ids.has(e.postId)) ||
                trackerKeys.has(key(row.kind || 'offer',row.schoolId,row.playerName,players.get(row.playerId)?.classYear))).length });
            console.log('APIFY_SAMPLE',JSON.stringify({ window: day, rows: result.posts.length, cost: result.health.cost, capped: result.health.atLimit,
              offers: metrics(references.filter(e=>!e.kind)), commits: metrics(references.filter(e=>e.kind)) }));
          }
          EOF
